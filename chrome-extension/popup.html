<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sledge Now Playing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      min-height: 200px;
      background: #0d0d12;
      color: #e8e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .header h1 {
      font-size: 13px; font-weight: 700;
      color: #fff; letter-spacing: -0.01em;
    }
    .header p {
      font-size: 10px; color: rgba(255,255,255,0.4);
      margin-top: 1px;
    }

    /* Toggle */
    .toggle-section {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .toggle-label { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 500; }
    .toggle-switch {
      position: relative; width: 40px; height: 22px; cursor: pointer;
    }
    .toggle-switch input { display: none; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.12);
      border-radius: 11px;
      transition: background 0.2s;
    }
    .toggle-slider::after {
      content: ''; position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .toggle-slider { background: #6366f1; }
    input:checked + .toggle-slider::after { transform: translateX(18px); }

    /* Auth section */
    .auth-section { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .section-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: rgba(255,255,255,0.35);
      margin-bottom: 10px;
    }
    .form-group { margin-bottom: 8px; }
    label { display: block; font-size: 11px; color: rgba(255,255,255,0.55); margin-bottom: 4px; }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      padding: 7px 10px;
      color: #e8e8f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: rgba(99,102,241,0.6); }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); margin-top: 6px; }
    .btn-danger:hover { background: rgba(239,68,68,0.22); }

    /* Status */
    .status-section { padding: 12px 18px 16px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px; font-weight: 600;
      border: 1px solid;
    }
    .status-badge.playing {
      background: rgba(99,102,241,0.12);
      color: #a78bfa;
      border-color: rgba(99,102,241,0.3);
    }
    .status-badge.paused {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.45);
      border-color: rgba(255,255,255,0.1);
    }
    .status-badge.off {
      background: rgba(239,68,68,0.08);
      color: rgba(239,68,68,0.6);
      border-color: rgba(239,68,68,0.15);
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .playing .status-dot { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .now-playing-info {
      margin-top: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .np-info-title {
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .np-info-artist {
      font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Msg */
    .msg { font-size: 11px; padding: 6px 0; border-radius: 6px; }
    .msg.error { color: #f87171; }
    .msg.success { color: #34d399; }

    /* Signed in state */
    .signed-in-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: rgba(52,211,153,0.07);
      border: 1px solid rgba(52,211,153,0.15);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .signed-in-email { font-size: 11px; color: #34d399; flex: 1; overflow: hidden; text-overflow: ellipsis; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🎵</div>
    <div>
      <h1>Sledge Now Playing</h1>
      <p>Broadcasts your music to sledge-classroom.web.app</p>
    </div>
  </div>

  <!-- Enable/Disable toggle -->
  <div class="toggle-section">
    <span class="toggle-label">📡 Broadcast enabled</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <div class="toggle-slider"></div>
    </label>
  </div>

  <!-- Auth section -->
  <div class="auth-section" id="auth-section">
    <div class="section-title">🔐 Admin Credentials</div>

    <!-- Not signed in -->
    <div id="sign-in-form">
      <p style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:10px;">
        Enter your Firebase admin email &amp; password once. Stored locally in Chrome only.
      </p>
      <div class="form-group">
        <label for="email-input">Email</label>
        <input type="email" id="email-input" placeholder="admin@example.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password-input">Password</label>
        <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="dburl-input">Realtime DB URL (optional)</label>
        <input type="text" id="dburl-input" placeholder="https://sledge-classroom-default-rtdb.firebaseio.com">
      </div>
      <div class="msg hidden" id="auth-msg"></div>
      <button class="btn btn-primary" id="save-btn">Save &amp; Connect</button>
    </div>

    <!-- Signed in -->
    <div id="signed-in-view" class="hidden">
      <div class="signed-in-row">
        <span>✅</span>
        <span class="signed-in-email" id="signed-in-email"></span>
      </div>
      <button class="btn btn-danger" id="sign-out-btn">Remove credentials</button>
    </div>
  </div>

  <!-- Status section -->
  <div class="status-section">
    <div class="section-title">📊 Current Status</div>
    <div id="status-badge" class="status-badge off">
      <div class="status-dot"></div>
      <span id="status-text">Disabled / not broadcasting</span>
    </div>
    <div class="now-playing-info hidden" id="np-info">
      <div class="np-info-title" id="np-title">—</div>
      <div class="np-info-artist" id="np-artist">—</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
