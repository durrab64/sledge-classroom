<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free NUML BSCS study platform. Download curated lecture notes, past papers, and programming lab materials on Sledge Classroom. 100% free with zero login."
    />
    <meta name="theme-color" content="#6366f1" />
    <title>Sledge Classroom | NUML BSCS Notes, Labs &amp; Past Papers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <script>
      // Prevent a light/dark flash before React mounts. Reads the same legacy
      // storage keys as the global experience provider; the provider remains
      // the single state authority after hydration.
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('theme');
          if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode);
          var theme = localStorage.getItem('zanpakuto_theme');
          if (theme) root.setAttribute('data-zanpakuto', theme);
          var accent = localStorage.getItem('sledge_accent');
          if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
            root.setAttribute('data-custom-accent', 'true');
            root.style.setProperty('--custom-accent', accent);
            var n = parseInt(accent.slice(1), 16);
            root.style.setProperty(
              '--custom-accent-rgb',
              ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255),
            );
          }
          if (localStorage.getItem('quiet_mode') === 'true') {
            document.body.classList.add('quiet-mode');
          }
        } catch (error) {
          /* storage unavailable: render with the default theme */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
